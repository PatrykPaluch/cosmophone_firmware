; PlatformIO Project Configuration File
; Board: ESP32-4848S040 (JCZN) — ESP32-S3, 480x480 ST7701 RGB, GT911 touch
;
; compile_commands.json: run the "Build" task in VS Code (it runs compiledb after build)

[base_configuration]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.psram = enabled
board_upload.flash_size = 16MB
; Must match app partition offset in board_build.partitions (default PlatformIO upload is 0x10000).
board_upload.offset_address = 0x20000
board_build.partitions = partitions/cosmophone_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DSCREEN_W=480
    -DSCREEN_H=480
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -Isrc

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.5
    TAMC_GT911


[env:release]
extends = base_configuration
build_src_filter =
    +<*>
    -<system/experiments/>


[env:display_test]
extends = base_configuration

build_src_filter =
    +<*>
    -<system/display.cpp>

build_flags =
    ${base_configuration.build_flags}
    -DNEW_DISPLAY_TEST=1
